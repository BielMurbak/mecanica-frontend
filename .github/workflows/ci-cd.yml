name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/bielmurbak/mecanica-frontend

jobs:
  build-and-test:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testes unitarios
        run: npm run test:unit

      - name: Testes de integracao
        run: npm run test:integration

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (vite build)
        run: npm run build

      - name: Definir chave de cache semanal (Trivy)
        id: trivy-cache-key
        run: echo "week=$(date +'%Y-%U')" >> "$GITHUB_OUTPUT"

      - name: Cache do banco de vulnerabilidades (Trivy)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ steps.trivy-cache-key.outputs.week }}
          restore-keys: trivy-db-

      - name: Validacao de dependencias (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          severity: CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload do relatorio (Trivy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Upload do artefato (dist)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist

  docker-build-push:
    name: Build & Push da imagem Docker
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy na EC2
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar codigo e reiniciar o container do frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ubuntu/mecanica-frontend
            git fetch origin main
            git reset --hard origin/main
            docker compose pull frontend
            docker compose up -d --force-recreate frontend
            docker image prune -f

      - name: Validar sucesso do deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || echo 000)
              if [ "$code" != "000" ]; then
                echo "Frontend respondeu HTTP $code - deploy OK"
                exit 0
              fi
              echo "Tentativa $i: frontend ainda nao respondeu, aguardando..."
              sleep 3
            done
            echo "Deploy FALHOU: frontend nao respondeu apos ~30s"
            exit 1
